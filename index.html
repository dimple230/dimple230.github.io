    /* ЕДИНЫЙ СТИЛЬ ДЛЯ ГЛАВНОЙ СТРАНИЦЫ */
    body {

      color: white; /* белый текст лучше виден на тёмном GIF */

    .card {

      font-size: 18px;
      font-family: 'Courier New', monospace;
    }

    /* Кнопки */
    .buttons {
      margin-top: 25px;
    }

    .btn {
      display: inline-block;
      margin: 8px;
      padding: 14px 28px;
      background-color: black;
      color: #d8b4fe; /* мягкий фиолетовый */
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      font-family: 'Courier New', monospace;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(216, 180, 254, 0.6);
    }
  </style>
</head>
